<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213D">
  <meta name="description" content="ACADELY helps you organize courses, grades, deadlines, and study time.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Acadely">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json?v=acadely-language-bar-1">
  <link rel="icon" type="image/svg+xml" href="assets/branding/favicon.svg?v=acadely-1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/branding/favicon-32.png?v=acadely-1">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/branding/favicon-16.png?v=acadely-1">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/branding/apple-touch-icon.png?v=acadely-language-bar-1">
  <title>ACADELY — Your academic workspace</title>
  <!-- This gate is inline so the workspace cannot paint before CSS/auth loads. -->
  <style id="startup-critical">
    [hidden]{display:none!important}:root{--language-bar-height:52px}html{background:#101522;color-scheme:dark}html[data-theme="light"]{background:#F7F8FC;color-scheme:light}
    body{margin:0}.boot-screen{min-height:calc(100vh - 52px);min-height:calc(100svh - 52px);display:grid;place-content:center;padding:24px;text-align:center;color:#F1F3F9;font-family:system-ui,sans-serif}.boot-screen p{max-width:36rem;line-height:1.6;color:#A0A8BA}.boot-screen h1{font-size:24px}html[data-theme="light"] .boot-screen{color:#171923}html[data-theme="light"] .boot-screen p{color:#737B8C}
    .language-bar{box-sizing:border-box;position:sticky;top:0;z-index:12;height:52px;display:flex;align-items:center;justify-content:flex-end;padding:4px 16px;background:#101522;color:#F1F3F9;font:13px system-ui,sans-serif}.language-options{display:flex;gap:4px;direction:ltr}.language-options button{min-height:44px;padding:8px 12px;border:0;border-radius:7px;background:transparent;color:inherit;font:inherit;cursor:pointer}.language-options button[aria-pressed="true"]{background:#4361EE;color:#fff}html[data-theme="light"] .language-bar{background:#F7F8FC;color:#171923}
  </style>
  <script>try{if(localStorage.getItem('acadely-theme')==='light')document.documentElement.dataset.theme='light';const initialLanguage=localStorage.getItem('acadely-language-v1');if(['en','ar','ru'].includes(initialLanguage)){document.documentElement.lang=initialLanguage;document.documentElement.dir=initialLanguage==='ar'?'rtl':'ltr';}}catch{}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=acadely-language-bar-1">
  <script src="locales/ar.js?v=acadely-language-bar-1" defer></script>
  <script src="locales/ru.js?v=acadely-language-bar-1" defer></script>
  <script src="js/i18n.js?v=acadely-language-bar-1" defer></script>
  <script src="js/startup.js?v=acadely-language-bar-1" defer></script>
  <script src="js/supabase-config.js?v=acadely-language-bar-1"></script>
  <script src="js/account-cloud.js?v=acadely-language-bar-1" defer></script>
  <script src="js/grade-math.js?v=acadely-2" defer></script>
  <script src="js/academic-planning.js?v=acadely-language-bar-1" defer></script>
  <script src="js/academic-automation.js?v=acadely-language-bar-1" defer></script>
  <script src="js/academic-ui.js?v=acadely-language-bar-1" defer></script>
  <script src="js/ux.js?v=acadely-language-bar-1" defer></script>
  <script src="js/app.js?v=acadely-language-bar-1" defer></script>
</head>
<body>
  <nav class="language-bar" aria-label="Language">
    <div class="language-options" role="group" aria-label="Language">
      <button type="button" data-language="en" lang="en" dir="ltr" translate="no" aria-pressed="true">English</button>
      <button type="button" data-language="ar" lang="ar" dir="rtl" translate="no" aria-pressed="false">العربية</button>
      <button type="button" data-language="ru" lang="ru" dir="ltr" translate="no" aria-pressed="false">Русский</button>
    </div>
  </nav>
        <section id="app-boot" class="boot-screen" role="status" aria-live="polite">
          <p class="eyebrow">ACADELY WORKSPACE</p>
          <h1>Opening your workspace</h1>
          <p id="startup-message">Loading your saved academic information. No grades or totals are shown until it is ready.</p>
          <button type="button" class="button button-secondary" id="startup-reload" hidden>Reload Acadely</button>
          <noscript><p>JavaScript is required to use Acadely. Enable it in your browser, then reload. Your existing browser data has not been cleared.</p></noscript>
        </section>
  <script>
    // Older installed workers may serve the previous app module once during an update.
    // Wait until that module has actually exposed auth or rendered the local workspace.
    window.addEventListener('acadely-rendered',()=>requestAnimationFrame(()=>{
      const shell=document.querySelector('.app-shell'),auth=document.querySelector('#auth-screen');
      if(window.ACADELY_SUPABASE_CONFIG?.configured!==true&&shell)shell.hidden=false;
      if((auth&&!auth.hidden)||(shell&&!shell.hidden))document.querySelector('#app-boot')?.setAttribute('hidden','');
    }));
  </script>
      <div class="update-status" id="update-status" role="status" aria-live="polite" hidden>
        <span>A new Acadely update is ready.</span>
        <button class="button button-secondary" type="button" data-action="apply-update">Reload to update</button>
      </div>
  <main id="auth-screen" class="auth-screen" hidden aria-live="polite"></main>
  <div class="app-shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" aria-label="ACADELY home">
        <img class="brand-logo" src="assets/branding/acadely-logo-white.svg" alt="ACADELY">
        <img class="brand-icon" src="assets/branding/acadely-icon-white.svg" alt="" aria-hidden="true">
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Workspace">
        <a class="nav-item" data-page="dashboard" href="#dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span class="nav-label">Dashboard</span></a>
        <a class="nav-item" data-page="courses" href="#courses"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 5c4-2 6-2 9 0 3-2 5-2 9 0v15c-4-2-6-2-9 0-3-2-5-2-9 0V5Zm9 0v15"/></svg></span><span class="nav-label">My Courses</span></a>
        <a class="nav-item" data-page="calendar" href="#calendar"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 11h18"/></svg></span><span class="nav-label">Calendar</span></a>
        <a class="nav-item" data-page="assignments" href="#assignments"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="15" height="17" rx="2"/><path d="m8 12 3 3 6-6"/></svg></span><span class="nav-label">Assignments</span></a>
        <a class="nav-item" data-page="grades" href="#grades"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 4v16h17M8 15l4-5 4 2 4-7"/></svg></span><span class="nav-label">Grades & GPA</span></a>
        <a class="nav-item" data-page="profile" href="#profile"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="nav-label">Student Profile</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a class="nav-item" data-page="planner" href="#planner"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></span><span class="nav-label">Study plan</span></a>
        <a class="nav-item" data-page="settings" href="#settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></span><span class="nav-label">Settings</span></a>
        <div class="sidebar-divider"></div>
        <button class="profile-button" type="button" aria-label="Open student profile">
          <span class="avatar">S</span><span class="profile-copy"><strong>Student</strong><small>Local profile · not verified</small></span><span class="more-icon">···</span>
        </button>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
        <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 9l-3 3 3 3"/></svg></button>
        <div class="breadcrumb"><a class="breadcrumb-home" href="#dashboard">Dashboard</a><span class="crumb-sep">/</span><strong>Dashboard</strong></div>
        <div class="topbar-actions"><span class="today-label" id="top-date"></span><button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button><button class="top-avatar" type="button" aria-label="Open student profile" data-action="ux-profile">S</button></div>
      </header>
      <div class="network-status" id="network-status" role="status" aria-live="polite" hidden></div>
      <div class="cloud-status" id="cloud-status" role="status" aria-live="polite" hidden></div>

      <div class="page-content" aria-busy="true">

      </div>
    </main>
  </div>
  <div class="mobile-overlay" id="mobile-overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
